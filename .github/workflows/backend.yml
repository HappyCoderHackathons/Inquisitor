name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project backend --locked
      - run: uvx ruff@0.17.5 check backend scripts tests
      - run: uv run --project backend python -m unittest discover -s tests -v
