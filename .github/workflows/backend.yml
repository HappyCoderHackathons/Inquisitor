name: Backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --project backend --locked
      - run: uvx ruff@0.17.5 check backend scripts tests python-keylogger
      - run: uv run --project backend python -m unittest discover -s tests -v

  collector:
    # pynput needs a desktop session to import, so collector tests run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --project python-keylogger --locked python -m unittest discover -s python-keylogger/tests -v
