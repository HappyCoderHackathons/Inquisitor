name: Web

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: Committed bundles match source
        run: npm run build && git diff --exit-code -- static
      - run: uv run --no-project --python 3.13 --with-requirements requirements.txt --with "mongomock>=4.3,<5" python -m unittest discover -s tests -v
