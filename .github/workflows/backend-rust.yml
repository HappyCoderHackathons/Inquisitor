name: Backend Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/rust/**'
      - 'docs/icons/png/**'
      - 'shared/fixtures/**'
      - '.github/workflows/backend-rust.yml'
  pull_request:
    paths:
      - 'backend/rust/**'
      - 'docs/icons/png/**'
      - 'shared/fixtures/**'
      - '.github/workflows/backend-rust.yml'
  workflow_dispatch:
  # release-rust.yml runs these same checks and builds before publishing.
  workflow_call:

concurrency:
  group: backend-rust-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  release:
    name: Release build
    runs-on: windows-latest
    needs: check
    defaults:
      run:
        working-directory: backend/rust
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend/rust
          key: release

      - name: Build release exe
        run: cargo build --release --locked

      # build.rs embeds app.manifest (themed controls, per-monitor DPI). If the
      # linker silently skipped it, the tray UI would fall back to the classic look.
      - name: Verify embedded manifest
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("target/release/Inquisitor.exe")
          $text = [System.Text.Encoding]::ASCII.GetString($bytes)
          foreach ($needle in "Microsoft.Windows.Common-Controls", "PerMonitorV2") {
            if (-not $text.Contains($needle)) { throw "manifest missing '$needle'" }
          }
          "manifest OK"
          # .cargo/config.toml links the CRT statically; a RUSTFLAGS override would silently undo it.
          if ($text -match "(?i)vcruntime140\.dll") { throw "exe imports vcruntime140.dll" }
          "static CRT OK"

      - name: Upload exe
        uses: actions/upload-artifact@v7
        with:
          name: inquisitor-windows-x64
          path: backend/rust/target/release/Inquisitor.exe
          if-no-files-found: error
          retention-days: 14

  clean-machine:
    name: Run on a clean Windows image
    # Windows Server Core ships without the Visual C++ runtime, so this proves the exe needs only system DLLs.
    # It pulls a multi-GB image, so it runs for releases and manual dispatch only.
    # In a called workflow, event_name is the caller's (push), so match the release tag instead.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    needs: release
    steps:
      - name: Download the built exe
        uses: actions/download-artifact@v5
        with:
          name: inquisitor-windows-x64
          path: dist

      - name: Run the exe in Server Core
        shell: pwsh
        run: |
          docker run --rm -v "${{ github.workspace }}\dist:C:\dist" mcr.microsoft.com/windows/servercore:ltsc2022 `
            cmd /c "if exist C:\Windows\System32\vcruntime140.dll (echo vcruntime140 present & exit 1) else (C:\dist\Inquisitor.exe --help)"
          if ($LASTEXITCODE -ne 0) { throw "exe failed on a clean image (exit $LASTEXITCODE)" }
          "clean image OK"
