name: Release Windows tray

# Push a version tag to publish a GitHub release with the tray exe:
#   1. Set `version` in backend/rust/Cargo.toml (for example 0.2.0) and commit.
#   2. git tag 0.2.0 && git push origin 0.2.0   (v0.2.0 works too)
# The tag, with or without a leading v, must match the Cargo.toml version
# exactly, which the setup wizard shows and records in Apps & features. For a
# prerelease, put the suffix in both (version 0.2.0-rc.1, tag 0.2.0-rc.1); a tag
# with a hyphen is published as a prerelease.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build
    # Format, clippy, tests, then the release exe with its manifest verified,
    # uploaded as the inquisitor-windows-x64 artifact.
    uses: ./.github/workflows/backend-rust.yml

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the tag matches the crate version
        id: version
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' backend/rust/Cargo.toml | head -n 1)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match backend/rust/Cargo.toml version $version. Set version = \"${TAG#v}\" there, or tag the crate's version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download the built exe
        uses: actions/download-artifact@v5
        with:
          name: inquisitor-windows-x64
          path: dist

      - name: Name the asset and write its checksum
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          asset="Inquisitor-$VERSION-windows-x64.exe"
          mv dist/Inquisitor.exe "dist/$asset"
          # A fixed name too, so the website can link to releases/latest/download/Inquisitor-windows-x64.exe.
          cp "dist/$asset" dist/Inquisitor-windows-x64.exe
          (cd dist && sha256sum "$asset" > "$asset.sha256")
          cat "dist/$asset.sha256"

      - name: Create the GitHub release, or add the exe to an existing one
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets=("dist/Inquisitor-$VERSION-windows-x64.exe" "dist/Inquisitor-$VERSION-windows-x64.exe.sha256" dist/Inquisitor-windows-x64.exe)
          # A release made by hand on GitHub creates the tag first; attach the
          # build to it (replacing any earlier upload) instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            exit 0
          fi
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --title "Inquisitor $VERSION" \
            --generate-notes \
            --notes "Download Inquisitor-$VERSION-windows-x64.exe and run it to install, update, or repair. Windows SmartScreen may warn because the exe is not code-signed. Check the download against the .sha256 file." \
            "${prerelease[@]}"
