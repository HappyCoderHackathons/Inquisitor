version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directories:
      - /backend
      - /python-keylogger
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /Frontend
      - /test
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /Frontend
      - /test
    schedule:
      interval: weekly
    ignore:
      # Types track the Node 22 runtime used in CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /backend/rust
    schedule:
      interval: weekly
