version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directories:
      - /backend
      - /python-keylogger
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories:
      - /Frontend
      - /test
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories:
      - /Frontend
      - /test
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /backend/rust
    schedule:
      interval: weekly
