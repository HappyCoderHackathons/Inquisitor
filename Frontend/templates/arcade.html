<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#09070D">
    <title>Inquisitor Arcade</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <div class="arcade-layout">
      <header class="arcade-header">
        <a class="brand" href="/">Inquisitor</a>
        <nav class="arcade-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/privacy">Privacy</a>
          <a href="#games">Games</a>
          <a href="#stats">Stats</a>
          <a href="/dashboard">Dashboard</a>
        </nav>
      </header>

      <main id="overview" class="arcade-main">
        <h1>Arcade</h1>
        <section class="quick-play">
          <div>
            <h2>Play all four games</h2>
            <p>One minute each</p>
          </div>
          <button id="sprintBtn" class="button primary">Start sprint</button>
        </section>

        <section id="games" class="game-section">
          <h2>Games</h2>
          <div class="game-grid" id="gameGrid"></div>
        </section>

        <section id="stats" class="stats-section">
          <article class="panel data-panel">
            <div class="panel-head">
              <h2>Recent games</h2>
              <button id="clearBtn" class="text-button">Clear</button>
            </div>
            <p id="arcadeStatus" class="collection-status" role="status" aria-live="polite">Loading recent games…</p>
            <div class="sample-total"><strong id="sampleCount">0</strong><span>rounds played</span></div>
            <div id="recentList" class="recent-list"><div class="empty">No games played yet.</div></div>
            <p class="privacy-note">Scores and input timing are saved locally.</p>
          </article>
        </section>
      </main>
    </div>

    <div id="gameOverlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
      <section class="game-modal">
        <div class="modal-head">
          <div><span id="modalMode" class="eyebrow"></span><h2 id="modalTitle">Aim Trainer</h2></div>
          <button id="closeGame" class="icon-button" aria-label="Close">×</button>
        </div>
        <div class="game-meta">
          <span id="gameInstruction">Click the targets</span>
          <span class="timer"><b id="gameTimer">150</b><small>SEC</small></span>
          <span class="score">SCORE <b id="gameScore">0</b></span>
        </div>
        <div id="gameStage" class="game-stage" tabindex="-1"></div>
        <div class="modal-foot"><span id="gameHint">Esc to close</span><button id="startGame" class="button primary">Start</button></div>
      </section>
    </div>
    <script src="/static/app.js"></script>
  </body>
</html>
